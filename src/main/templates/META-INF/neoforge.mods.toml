## 精妙背包：氧化还原 —— NeoForge 26.2 元数据
## 铁律（《AI模组开发通用/03-工程结构与元数据》§3.1）：
##   1. iconFile / displayURL / issueTrackerURL 必须写在 [[mods]] 子表内，写顶层不生效；
##   2. 26.2 起小图标槽位读 iconFile（logoFile 已废弃），只有 1:1 方图时必须用 iconFile；
##   3. description 基础字符串不得含真实换行（本文件用 ''' 多行基本串，换行合法）。
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
iconFile="assets/${mod_id}/icon.png"
displayURL="${mod_display_url}"
issueTrackerURL="${mod_issue_tracker_url}"
description='''Oxidize, reduce and wax copper blocks right inside your backpack.'''

## 前置依赖：精妙背包（必需）+ 精妙核心（由精妙背包带入，此处显式声明以便给出明确提示）
## 版本区间口径同精妙背包自身：MC 前缀后的纯版本号做下限，避免段比较倒挂
[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
type="required"
versionRange="[3.26.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedcore"
type="required"
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
